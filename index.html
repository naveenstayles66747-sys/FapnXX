      />
    </noscript>

    <!-- ExoClick Dynamic Popunder (Deferred via requestIdleCallback to protect FCP & INP) -->
    <script type="application/javascript">
      (function() {
        var loadPopunder = function() {
          try {
            if (document.getElementById('popmagicldr')) return;
            var isMobile = window.innerWidth < 1024 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            var targetZoneId = isMobile ? 6010174 : 6010172;

            var adConfig = {
              "ads_host": "a.pemsrv.com",
              "syndication_host": "s.pemsrv.com",
              "idzone": targetZoneId,
              "popup_fallback": true,
              "popup_force": false,
              "chrome_enabled": true,
              "new_tab": true,
              "frequency_period": 60,
              "frequency_count": 1,
              "trigger_method": 3,
              "trigger_class": "",
              "trigger_delay": 0,
              "capping_enabled": true,
              "tcf_enabled": true,
              "agego_cross_site_enabled": true,
              "only_inline": false
            };

            var s = document.createElement("script");
            s.type = "application/javascript";
            s.async = true;
            s.src = "https://" + adConfig.ads_host + "/popunder1000.js";
            s.id = "popmagicldr";
            for (var key in adConfig) {
              if (Object.prototype.hasOwnProperty.call(adConfig, key) && key !== "ads_host" && key !== "syndication_host") {
                s.setAttribute("data-exo-" + key, adConfig[key]);
              }
            }
            document.body.appendChild(s);
          } catch (e) {}
        };

        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(loadPopunder, { timeout: 2500 });
        } else if (document.readyState === 'complete') {
          setTimeout(loadPopunder, 1200);
        } else {
          window.addEventListener('load', function() {
            setTimeout(loadPopunder, 1200);
          });
        }
      })();
    </script>

  <body class="bg-[#09090b] text-[#e5e1e4] font-['Inter',sans-serif] antialiased selection:bg-[#ec4899] selection:text-white min-h-screen">

    <script type="module" src="/src/main.tsx"></script>
